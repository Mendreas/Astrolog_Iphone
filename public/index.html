<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AstroLogs" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />

    <!-- iOS Splash Screens (iPhone) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
      href="%PUBLIC_URL%/logo512.png" />

    <meta name="description" content="Log your astronomical observations, track sky events, and explore the universe." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>AstroLogs</title>

    <style>
      /* Prevent iOS input zoom */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* Safe area padding for iPhone notch / Dynamic Island */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      /* Prevent pull-to-refresh */
      html {
        overscroll-behavior: none;
      }

      /* Splash screen while loading */
      #root:empty::before {
        content: '🔭';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 64px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      }
    </style>

    <!-- Elfsight Website Translator -->
    <script src="https://static.elfsight.com/platform/platform.js" async></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
